name: Check MCP Worker
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
